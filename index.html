<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAM Chemistry Lab</title>
  <meta name="description" content="Interactive chemistry lab — 118 elements, reactions, and virtual experiments.">
  <meta name="theme-color" content="#059669">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo" aria-label="BAM Chemistry Lab">
        <svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="20" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#d97706">BAM</text>
          <text x="245" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-style="italic" fill="#059669">Chem</text>
          <circle cx="555" cy="88" r="9" fill="#d97706"/>
        </svg>
      </a>
      <ul class="nav-links">
        <li><a href="#periodic" class="active" data-i18n="nav.periodic_table">Periodic Table</a></li>
        <li><a href="#reactions" data-i18n="nav.reactions">Reactions</a></li>
        <li><a href="#lab" data-i18n="nav.lab">Virtual Lab</a></li>
        <li><a href="#challenges" data-i18n="nav.challenges">Challenges</a></li>
      </ul>
      <select id="langSwitcher" class="lang-switcher" aria-label="Language">
        <option value="en">EN</option>
        <option value="ur">اردو</option>
      </select>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="app.title">BAM Chemistry Lab</h1>
      <p data-i18n="app.tagline">Explore all 118 elements — click any to see details</p>
    </section>

    <section class="periodic-section">
      <div class="periodic-controls">
        <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="Search element (name, symbol, number)...">
        <div class="filter-pills" id="filterPills">
          <button class="filter-pill active" data-filter="all" data-i18n="filters.all">All</button>
          <button class="filter-pill" data-filter="metal" data-i18n="filters.metal">Metals</button>
          <button class="filter-pill" data-filter="nonmetal" data-i18n="filters.nonmetal">Non-metals</button>
          <button class="filter-pill" data-filter="noble" data-i18n="filters.noble">Noble</button>
        </div>
      </div>

      <div class="periodic-grid-wrap">
        <div id="periodicGrid" class="periodic-grid" aria-label="Periodic table"></div>

        <div class="f-block-label" data-i18n="fblock.lanthanides">Lanthanides (57–71)</div>
        <div id="lanthanidesGrid" class="f-block-grid" aria-label="Lanthanides"></div>

        <div class="f-block-label" data-i18n="fblock.actinides">Actinides (89–103)</div>
        <div id="actinidesGrid" class="f-block-grid" aria-label="Actinides"></div>
      </div>

      <div class="legend" id="legend"></div>
    </section>
  </main>

  <div id="elementModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">×</button>
      <h3 id="modalTitle">Element</h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p data-i18n="footer.copyright">© 2026 BAM Studios — BAM Chemistry Lab</p>
    <p data-i18n="footer.made_with" style="margin-top: 6px;">Made with ❤️ in Pakistan</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="app-v4.js?v=1"></script>
</body>
</html>
